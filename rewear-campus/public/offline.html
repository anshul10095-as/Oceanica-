<!doctype html>
<html lang="en-IN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Offline · ReWear Campus</title>
<meta name="theme-color" content="#164B35" />
<style>
  :root { --bg: #FAF8F2; --fg: #202420; --muted: #58615a; --brand: #164B35; color-scheme: light; }
  @media (prefers-color-scheme: dark) { :root { --bg: #0d1511; --fg: #ECEAE2; --muted: #a3ada3; --brand: #B9CDB5; color-scheme: dark; } }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--fg); font-family: Manrope, system-ui, -apple-system, 'Segoe UI', sans-serif; padding: 24px max(16px, env(safe-area-inset-left)); text-align: center; }
  h1 { font-family: 'Cormorant Garamond', Georgia, serif; font-size: 40px; margin: 18px 0 8px; font-weight: 600; }
  p { color: var(--muted); max-width: 40ch; margin: 0 auto 20px; line-height: 1.5; }
  button { background: var(--brand); color: var(--bg); border: 0; border-radius: 999px; height: 46px; padding: 0 24px; font: 600 15px inherit; cursor: pointer; }
</style>
</head>
<body>
  <main>
    <img src="./icons/icon-192.png" width="72" height="72" alt="" />
    <h1>You are offline</h1>
    <p>ReWear needs a connection to check live availability, so reservations and payments are paused. Reconnect and try again.</p>
    <button onclick="location.reload()">Try again</button>
  </main>
</body>
</html>
